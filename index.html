<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fork-Knife</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Heading part Starts -->
    <header>
        <div class="Heading">
            <h3>Fork-Knife: Global Cuisine Explorer</h3>
            <h1>Discover dishes from</h1>
            <h1>every corner of the World</h1>
        </div>
        <div class="search-bar">
            <div id="search_input">
                <input type="text" name="search-bar_input" id="search-bar_input">
                <button> Search </button>
            </div>
        </div>
        <div class="filter_bar">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Beef</button>
            <button class="filter-btn">Chicken</button>
            <button class="filter-btn">Dessert</button>
            <button class="filter-btn">Lamb</button>
            <button class="filter-btn">Pasta</button>
            <button class="filter-btn">Pork</button>
            <button class="filter-btn">Seafood</button>
            <button class="filter-btn">Side</button>
            <button class="filter-btn">Starter</button>
            <button class="filter-btn">Vegan</button>
            <button class="filter-btn">Vegetarian</button>
            <button class="filter-btn">Breakfast</button>
            <button class="filter-btn">Goat</button>
        </div>
    </header>
    <!-- heading Part Over -->




    <!-- Main Content Starts -->
    <main>
        <div class="container">
            <!-- left side -->
            <div class="left-main">
                <div class="top-bar">
                    <!-- <p>Showing xyz recipes</p> -->
                </div>

                <div id="loader">Loading recipes...</div>
                <div class="straight_caraousel">
                    <!-- Recipes -->
                </div>

            </div>


            <!-- right side -->
            <div class="right-main">
                <div class="caraousel">
                    <!-- abcd -->
                </div>

                <div class="library-stats">
                    <!-- Total -->
                </div>

                <div class="top-cuisines">
                    <!-- India -->
                </div>
            </div>
        </div>
    </main>
    
    
    <div id="recipe-popup" class="popup">

        <div class="popup-content">
            <span class="close-btn">&times;</span>
            <h2 id="popup-title"></h2>
            <img id="popup-img" />
            <h3>Ingredients</h3>
            <ul id="popup-ingredients"></ul>
            <h3>Instructions</h3>
            <p id="popup-instructions"></p>
            <a id="popup-yt" target="_blank">Watch on YouTube</a>

        </div>

    </div>





    <script src="script.js"></script>
</body>
</html>
